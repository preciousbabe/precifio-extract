[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "vite"
  targetPort = 5173
  functions = "netlify/functions"
  framework = "#custom"

# ── STATIC PAGES (served before SPA catch-all) ──
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/reconcile-guide"
  to = "/reconcile-guide.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/api/paddle/list-packages"
  to = "/.netlify/functions/paddle/list-packages"
  status = 200

[[redirects]]
  from = "/api/paddle/checkout"
  to = "/.netlify/functions/paddle/checkout"
  status = 200

[[redirects]]
  from = "/api/paddle/webhook"
  to = "/.netlify/functions/paddle/webhook"
  status = 200

  
# ── SPA CATCH-ALL (MUST BE LAST) ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── CORS HEADERS ──
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"